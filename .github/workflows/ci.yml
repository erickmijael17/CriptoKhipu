name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Incluye la validación del checksum del wrapper de Gradle.
      - uses: gradle/actions/setup-gradle@v4

      # Desde Windows, git puede guardar gradlew sin permiso de ejecución.
      - name: Permiso de ejecución para gradlew
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build y verificaciones (Checkstyle Mija, ArchUnit, pruebas)
        run: ./gradlew check --console=plain
